name: Verify nine Launch SDKs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.4'
          bundler: none
      - name: Install ordinary build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev cmake build-essential
          python -m pip install 'cryptography>=44.0.1,<49' build twine 'setuptools>=68' wheel
          gem install base64 --no-document
          rustup default stable
      - name: Verify all nine source integrations and signed authorization fixtures
        run: python scripts/check-source.py
      - name: Build and inspect all nine language distributions
        run: |
          python scripts/build-packages.py --out dist
          python scripts/verify-release.py --packages dist
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Compile a TypeScript consumer against the package exports
        run: npm exec --yes --package typescript@5.9.3 -- tsc --strict --noEmit --module nodenext --moduleResolution nodenext --target es2022 sdk/javascript/test/types.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-build-and-verification
          path: |
            dist/*
            .cache/source-check/report.json
          if-no-files-found: error
