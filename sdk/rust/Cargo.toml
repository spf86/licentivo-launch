[package]
name = "licentivo-launch"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
license = "MIT"
description = "Launch account lifecycle with official Licentivo runtime authorization"
repository = "https://github.com/spf86/licentivo-launch-sdk"
homepage = "https://github.com/spf86/licentivo-launch-sdk"
documentation = "https://github.com/spf86/licentivo-launch-sdk/blob/main/docs/manual-integration.md"
keywords = ["licentivo", "launch", "licensing", "authentication", "sdk"]
categories = ["authentication"]
include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "Cargo.package.lock", "README.md", "LICENSE", "vendor/**"]

[dependencies]
serde_json = "1.0"
sha2 = "=0.10.9"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
time = { version = "=0.3.44", features = ["parsing"] }

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
