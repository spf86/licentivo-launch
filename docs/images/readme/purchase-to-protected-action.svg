<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title description">
  <title id="title">From checkout to a protected feature</title>
  <desc id="description">Publish a product, verify payment, synchronize the purchase entitlement, then let the licensing SDK check protected actions in the customer's application.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#537667" stroke-width="1.6" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="348" rx="20" fill="#f7f9f7" stroke="#dce5df"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="34" y="47" fill="#173a2b" font-size="27" font-weight="700">From checkout to a protected feature</text>
    <text x="34" y="77" fill="#5b6f63" font-size="16">Your brand, your store and your customer accounts.</text>
    <text x="34" y="119" fill="#456554" font-size="12" font-weight="700" letter-spacing="1.2">SELF-HOSTED LAUNCH STORE</text>
    <text x="916" y="119" fill="#456554" font-size="12" font-weight="700" letter-spacing="1.2">YOUR APPLICATION</text>
    <g fill="#fff" stroke="#d5e1d9">
      <rect x="32" y="138" width="254" height="139" rx="12"/>
      <rect x="326" y="138" width="254" height="139" rx="12"/>
      <rect x="620" y="138" width="254" height="139" rx="12"/>
      <rect x="914" y="138" width="254" height="139" rx="12" fill="#e9f1ec" stroke="#98b5a4"/>
    </g>
    <g fill="#2c674c" font-size="13" font-weight="700">
      <text x="52" y="166">01</text><text x="346" y="166">02</text><text x="640" y="166">03</text><text x="934" y="166">04</text>
    </g>
    <g fill="#173a2b" font-size="20" font-weight="700">
      <text x="52" y="198">Publish products</text><text x="346" y="198">Verify payment</text><text x="640" y="198">Sync access</text><text x="934" y="198">Protect actions</text>
    </g>
    <g fill="#52695b" font-size="15">
      <text x="52" y="229">Branded product pages,</text><text x="52" y="252">plans and downloads</text>
      <text x="346" y="229">Confirmed provider events</text><text x="346" y="252">and recorded orders</text>
      <text x="640" y="229">Customer entitlements</text><text x="640" y="252">and licensing receipts</text>
      <text x="934" y="229">Sign in with a store account;</text><text x="934" y="252">guard work with RunFeature</text>
    </g>
    <g fill="none" stroke="#537667" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M294 208h22"/><path d="M588 208h22"/><path d="M882 208h22"/>
    </g>
    <text x="34" y="316" fill="#5b6f63" font-size="15">Launch records purchases and access. The licensing SDK authorizes each protected operation.</text>
  </g>
</svg>
